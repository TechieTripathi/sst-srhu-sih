{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block bare_content %}
<div class="login-shell">
  <div class="login-brand">
    <img class="login-brand__mountains" src="{{ url_for('static', filename='images/mountains.svg') }}" alt="">
    <h1>{{ event_name }}</h1>
    <div class="tagline">{{ event_tagline }}</div>
    <div class="subtagline">From Ideas to Impact</div>
  </div>
  <div class="login-panel">
    <div class="login-card">
      <h2>Sign In</h2>
      <form method="POST" data-guard-submit>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="form-hint" style="margin-top:16px;">Access is role-based — Admin, Jury and Team accounts are provisioned by the organizing committee.</p>
    </div>
  </div>
</div>
{% endblock %}
