{% extends "base.html" %}
{% block title %}Add Jury{% endblock %}
{% block page_title %}Add Jury{% endblock %}
{% block content %}
<form method="POST" class="card" data-guard-submit style="max-width:560px;">
  <div class="form-group">
    <label for="name">Full Name</label>
    <input class="form-control" id="name" name="name" required>
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input class="form-control" type="email" id="email" name="email" required>
  </div>
  <div class="form-group">
    <label for="password">Temporary Password</label>
    <input class="form-control" type="password" id="password" name="password" required>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="designation">Designation</label>
      <input class="form-control" id="designation" name="designation">
    </div>
    <div class="form-group">
      <label for="organization">Organization</label>
      <input class="form-control" id="organization" name="organization">
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Add Jury Member</button>
</form>
{% endblock %}
