{% extends "base.html" %}
{% block title %}Registration closed{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg text-center py-10 sm:py-16">
    <div class="mx-auto h-14 w-14 rounded-full bg-navy-100 text-navy-800 flex items-center justify-center text-2xl" aria-hidden="true">🔒</div>
    <h1 class="font-display text-2xl sm:text-3xl font-bold text-navy-900 mt-4">Team registration is closed</h1>
    <p class="mt-3 text-slate-600">{{ event_name }} isn't accepting new teams right now. If you think this is a mistake, contact the organising team at {{ school_name }}.</p>
    <a href="{{ url_for('index') }}" class="btn-navy mt-8">Back to homepage</a>
</div>
{% endblock %}
